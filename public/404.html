<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SwingView — Page not found</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  .notfound-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 28px; }
  .notfound-actions a { display: inline-flex; align-items: center; font-weight: 600; font-size: 15px; padding: 12px 22px; border-radius: 999px; text-decoration: none; }
  .notfound-actions .primary { background: var(--accent); color: #06120a; }
  .notfound-actions .secondary { border: 1px solid var(--border); color: var(--text); }

  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface-2: #1c1c1c;
    --border: #2a2a2a;
    --text: #e8e8e8;
    --text-secondary: #999999;
    --accent: #34C759;
    --accent-dim: rgba(52, 199, 89, 0.10);
    --gold: #c9a84c;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  .header {
    border-bottom: 1px solid var(--border);
    padding: 24px 0;
    position: sticky;
    top: 0;
    background: rgba(10, 10, 10, 0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    z-index: 100;
  }

  .header-inner {
    max-width: 780px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
    letter-spacing: -0.02em;
  }

  .logo span {
    color: var(--text);
    font-weight: 400;
  }

  .header-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-secondary);
    background: var(--surface-2);
    padding: 4px 10px;
    border-radius: 4px;
    border: 1px solid var(--border);
  }

  .container {
    max-width: 780px;
    margin: 0 auto;
    padding: 60px 24px 120px;
  }

  .page-title {
    font-size: 42px;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.1;
    margin-bottom: 16px;
  }

  .effective-date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 48px;
    padding-bottom: 48px;
    border-bottom: 1px solid var(--border);
  }

  .section {
    margin-bottom: 48px;
  }

  .section-number {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--accent);
    display: block;
    margin-bottom: 8px;
    letter-spacing: 0.05em;
  }

  h2 {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 20px;
    color: var(--text);
  }

  h3 {
    font-size: 17px;
    font-weight: 600;
    margin-top: 28px;
    margin-bottom: 12px;
    color: var(--text);
  }

  p {
    color: var(--text-secondary);
    margin-bottom: 16px;
    font-size: 15.5px;
  }

  .callout {
    background: var(--accent-dim);
    border-left: 3px solid var(--accent);
    padding: 20px 24px;
    border-radius: 0 8px 8px 0;
    margin: 24px 0;
  }

  .callout p {
    color: var(--text);
    margin-bottom: 0;
    font-size: 15px;
  }

  .callout strong {
    color: var(--accent);
  }

  .data-table {
    width: 100%;
    border-collapse: collapse;
    margin: 24px 0;
    font-size: 14px;
  }

  .data-table th {
    text-align: left;
    padding: 12px 16px;
    background: var(--surface-2);
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
  }

  .data-table td {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    color: var(--text-secondary);
    vertical-align: top;
  }

  .data-table tr:last-child td {
    border-bottom: none;
  }

  .data-table .label {
    color: var(--text);
    font-weight: 500;
    white-space: nowrap;
  }

  ul {
    padding-left: 20px;
    margin-bottom: 16px;
  }

  li {
    color: var(--text-secondary);
    font-size: 15.5px;
    margin-bottom: 8px;
    padding-left: 4px;
  }

  li::marker {
    color: var(--accent);
  }

  .contact-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    margin-top: 24px;
  }

  .contact-card p {
    margin-bottom: 8px;
  }

  .contact-card a {
    color: var(--accent);
    text-decoration: none;
  }

  .contact-card a:hover {
    text-decoration: underline;
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 48px 0;
  }

  .footer {
    border-top: 1px solid var(--border);
    padding: 32px 0;
    text-align: center;
  }

  .footer p {
    font-size: 13px;
    color: var(--text-secondary);
  }

  .footer a {
    color: var(--accent);
    text-decoration: none;
  }

  @media (max-width: 600px) {
    .page-title { font-size: 32px; }
    .container { padding: 40px 20px 80px; }
    .data-table { font-size: 13px; }
    .data-table th, .data-table td { padding: 10px 12px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <a href="https://swingview.ai" class="logo">SwingView <span>AI</span></a>
    <span class="header-badge">404</span>
  </div>
</div>

<div class="container">

  <h1 class="page-title">That page doesn&rsquo;t exist.</h1>
  <p class="effective-date">Error 404</p>

  <div class="section">
    <p>The link may be out of date, or the address may have a typo. Everything SwingView has to offer is on the home page.</p>
    <div class="notfound-actions">
      <a href="https://swingview.ai" class="primary">Back to SwingView</a>
      <a href="mailto:support@swingview.ai" class="secondary">Contact support</a>
    </div>
  </div>

</div>

<div class="footer">
  <p>&copy; 2026 Predictive Growth Labs. All rights reserved. &nbsp;·&nbsp; <a href="https://swingview.ai">swingview.ai</a></p>
</div>

</html>
